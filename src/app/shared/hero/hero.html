<section class="bg-slate-50 text-slate-600 body-font min-h-screen">
  <div class="container mx-auto flex px-5 py-24 md:flex-row flex-col items-center">
    <div
      class="lg:flex-grow md:w-1/2 lg:pr-24 md:pr-16 flex flex-col md:items-start md:text-left mb-16 md:mb-0 items-center text-center bg-white shadow-lg border border-slate-200 overflow-hidden"
    >
      <div class="bg-[#e49b38] w-full py-6 px-4">
        <h1 class="title-font sm:text-3xl text-2xl font-semibold text-white text-center">{{titulo}}</h1>
      </div>
      <div class="p-10 flex flex-col items-center w-full">
        <p class="mb-8 leading-relaxed text-lg text-slate-700 text-center font-medium">{{contenido}}</p>
        <div class="flex justify-center">
          <button routerLink="/home"
            class="inline-flex items-center text-white bg-[#5681aa] border-0 py-2 px-6 focus:outline-none hover:bg-[#43678b] rounded shadow-md text-lg font-semibold transition"
          >
            <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
            Home
          </button>
        </div>
      </div>
    </div>
    <div class="lg:max-w-lg lg:w-full md:w-1/2 w-5/6">
      <div class="bg-white shadow-lg border-t-8 border-t-[#000080] p-6 text-center">
        <h3 class="font-bold text-xl mb-4 text-[#000080]">S/N</h3>
        <h2 class="font-extrabold text-2xl text-slate-800 mb-8">FUERZA AÉREA ECUATORIANA</h2>
        <img
          class="object-contain object-center h-64 w-full mx-auto"
          alt="hero"
          [src]="imagenUrl"
        />
      </div>
    </div>
  </div>
</section>
